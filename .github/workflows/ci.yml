name: Nhom 07 (65HTTT) CI

on:
  push:
    branches: [dev]
    paths:
      - 'nhom07-65httt/src/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'nhom07-65httt/src/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ai, worker]
    defaults:
      run:
        working-directory: nhom07-65httt/src/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nhom07-65httt/src/${{ matrix.service }}/requirements*.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt ruff==0.15.14
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q

  frontend:
    name: frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nhom07-65httt/src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nhom07-65httt/src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  compose:
    name: docker compose validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nhom07-65httt/src
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --env-file .env.example config --quiet
